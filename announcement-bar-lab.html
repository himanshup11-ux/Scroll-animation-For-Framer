<title>Announcement Bar Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Light palette — neutrals biased warm-red toward the CU accent */
  :root {
    --accent: #ff3b4d;
    --accent-soft: rgba(255, 59, 77, 0.13);
    --bg: #f7f4f5;
    --surface: #ffffff;
    --surface-2: #faf7f8;
    --border: #e6e0e2;
    --border-firm: #d6cdd0;
    --text: #1a1619;
    --muted: #786e73;
    --faint: #a2979c;
    --ok: #1f9268;
    --warn: #c07a12;
    --shadow: 0 1px 2px rgba(26, 22, 25, .05), 0 8px 24px rgba(26, 22, 25, .05);
    --stage-ink: #f2eef0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent: #ff5062;
      --accent-soft: rgba(255, 80, 98, 0.16);
      --bg: #0d0b0e;
      --surface: #161318;
      --surface-2: #1b171d;
      --border: #2b262c;
      --border-firm: #3a343b;
      --text: #f2eef0;
      --muted: #928891;
      --faint: #6d646b;
      --ok: #3fbc8d;
      --warn: #e0a340;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .34);
    }
  }
  :root[data-theme="dark"] {
    --accent: #ff5062;
    --accent-soft: rgba(255, 80, 98, 0.16);
    --bg: #0d0b0e;
    --surface: #161318;
    --surface-2: #1b171d;
    --border: #2b262c;
    --border-firm: #3a343b;
    --text: #f2eef0;
    --muted: #928891;
    --faint: #6d646b;
    --ok: #3fbc8d;
    --warn: #e0a340;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .34);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 15px/1.6 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 24px 80px; }

  /* ── Masthead ── */
  .masthead { margin-bottom: 34px; }
  .eyebrow {
    margin: 0 0 12px;
    font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--faint);
  }
  h1 {
    margin: 0 0 14px;
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 4.6vw, 46px);
    line-height: 1.04;
    letter-spacing: -.022em;
    text-wrap: balance;
  }
  .lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: 15.5px; }

  /* ── Stage: stays dark in both themes; glass needs a rich ground ── */
  .stage-block { margin-bottom: 40px; }
  .stage {
    border-radius: 18px;
    border: 1px solid var(--border);
    padding: clamp(22px, 4vw, 44px) clamp(16px, 3vw, 34px);
    display: flex;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(58% 74% at 8% 16%, #ff9a5a 0%, rgba(255,154,90,0) 58%),
      radial-gradient(52% 82% at 86% 8%, #4fc3ff 0%, rgba(79,195,255,0) 60%),
      radial-gradient(72% 76% at 72% 96%, #a97bff 0%, rgba(169,123,255,0) 60%),
      repeating-linear-gradient(58deg, #100f16 0 30px, #1a1826 30px 60px);
    box-shadow: var(--shadow);
  }
  .stage-inner { width: var(--stage-w, 100%); transition: width .18s ease; }

  .scrub-stage {
    border-radius: 14px;
    padding: 30px 24px;
    margin-bottom: 22px;
    overflow: hidden;
    background:
      radial-gradient(60% 80% at 14% 20%, #ff8f6a 0%, rgba(255,143,106,0) 58%),
      radial-gradient(60% 90% at 84% 96%, #7c6cff 0%, rgba(124,108,255,0) 60%),
      repeating-linear-gradient(58deg, #100f16 0 30px, #1a1826 30px 60px);
    border: 1px solid var(--border);
  }

  /* ── Panels ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px clamp(18px, 3vw, 28px) 22px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .panel-h {
    margin: 0 0 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -.012em;
  }
  .panel-note {
    font: 400 12px/1 "IBM Plex Mono", ui-monospace, monospace;
    color: var(--faint);
    letter-spacing: .01em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(196px, 1fr));
    gap: 18px 26px;
    align-items: end;
  }
  .hint {
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13.5px;
    max-width: 76ch;
  }
  .hint strong, .hint em { color: var(--text); }
  .hint em { font-style: normal; font-weight: 600; }

  /* ── Controls ── */
  .ctl { display: flex; flex-direction: column; gap: 9px; }
  .ctl.is-off { opacity: .38; }
  .ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ctl-name {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .ctl-val {
    font: 500 13px/1 "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 20px; margin: 0;
    background: transparent; cursor: pointer;
  }
  input[type="range"]:disabled { cursor: not-allowed; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 999px; background: var(--border-firm);
  }
  input[type="range"]::-moz-range-track {
    height: 4px; border-radius: 999px; background: var(--border-firm);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; margin-top: -5.5px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid var(--surface);
    box-shadow: 0 1px 4px rgba(0,0,0,.28);
    transition: transform .13s ease;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface);
    box-shadow: 0 1px 4px rgba(0,0,0,.28);
  }
  input[type="range"]:hover:not(:disabled)::-webkit-slider-thumb { transform: scale(1.16); }
  input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 3px; }

  .tgl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tgl-row--lead { margin-bottom: 20px; }
  .tgl {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 7px 14px 7px 8px;
    border-radius: 999px;
    border: 1px solid var(--border-firm);
    background: var(--surface-2);
    color: var(--muted);
    font: 500 12.5px/1 "IBM Plex Sans", sans-serif;
    cursor: pointer;
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }
  .tgl:hover { border-color: var(--accent); }
  .tgl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tgl.is-on { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .tgl-track {
    width: 30px; height: 17px; border-radius: 999px; flex: 0 0 auto;
    background: var(--border-firm); position: relative; transition: background .16s ease;
  }
  .tgl.is-on .tgl-track { background: var(--accent); }
  .tgl-knob {
    position: absolute; top: 2.5px; left: 2.5px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff; transition: transform .16s cubic-bezier(.22,1,.36,1);
  }
  .tgl.is-on .tgl-knob { transform: translateX(13px); }

  /* ── Scrubber ── */
  .scrub { display: flex; flex-direction: column; gap: 14px; }
  .scrub-read { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .scrub-fig {
    font: 400 12.5px/1 "IBM Plex Mono", ui-monospace, monospace;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .scrub-fig b { color: var(--text); font-weight: 500; }
  .chip {
    font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid currentColor;
  }
  .chip--holding { color: var(--ok); }
  .chip--leaving { color: var(--warn); }
  .chip--cleared { color: var(--faint); }
  .scrub-track { position: relative; padding-bottom: 20px; }
  .scrub-marks { position: relative; height: 0; }
  .scrub-marks span {
    position: absolute; top: 2px; transform: translateX(-50%);
    font: 400 10.5px/1 "IBM Plex Mono", ui-monospace, monospace;
    color: var(--faint);
  }
  .scrub-marks span::before {
    content: ""; position: absolute; left: 50%; top: -9px;
    width: 1px; height: 6px; background: var(--border-firm);
  }

  /* ── Footer ── */
  .foot {
    margin-top: 30px; padding-top: 22px;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 13.5px;
  }
  .foot p { margin: 0 0 10px; max-width: 76ch; }
  .foot-note { color: var(--faint); }
  code {
    font: 400 .92em/1 "IBM Plex Mono", ui-monospace, monospace;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 5px;
    color: var(--text);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
